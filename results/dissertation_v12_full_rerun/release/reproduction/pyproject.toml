[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-marl-faithfulness"
version = "0.2.0"
description = "Graph-attention MARL fleet dispatch under telemetry degradation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "torch==2.2.2",
  "gymnasium==1.3.0",
  "pettingzoo==1.26.1",
  "python-dotenv==1.2.2",
  "matplotlib==3.11.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
sumo127 = ["sumolib==1.27.0", "traci==1.27.0"]
macos-intel = [
  "eclipse-sumo==1.20.0",
  "sumolib==1.20.0",
  "traci==1.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: starts SUMO and exercises the full environment",
]
